name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - 'backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          if [ -d "starter/backend" ]; then
            cd starter/backend
          else
            cd backend
          fi
          pipenv install --dev

      - name: Run lint
        run: |
          if [ -d "starter/backend" ]; then
            cd starter/backend
          else
            cd backend
          fi
          pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          if [ -d "starter/backend" ]; then
            cd starter/backend
          else
            cd backend
          fi
          pipenv install --dev

      - name: Run test
        run: |
          if [ -d "starter/backend" ]; then
            cd starter/backend
          else
            cd backend
          fi
          pipenv run test

  build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application using Docker
        run: |
          if [ -d "starter/backend" ]; then
            cd starter/backend
          else
            cd backend
          fi
          docker build --tag mp-backend:latest .
